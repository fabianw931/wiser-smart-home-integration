# Starter Home Assistant package; not installed or enabled by this repository.
# Requires app + HA in the SAME network namespace (127.0.0.1).
# secrets.yaml: wiser_workspace_authorization: "Bearer <integration-token>"
# Do not substitute a remote address until a separately secured deployment exists.
rest:
  - resource: http://127.0.0.1:3000/api/integration/v1/snapshot
    headers:
      Authorization: !secret wiser_workspace_authorization
    scan_interval: 30
    timeout: 35
    sensor:
      - name: Wiser workspace inventory
        unique_id: wiser_workspace_inventory
        value_template: "{{ value_json.entities | count }}"
        json_attributes:
          - entities
          - gateway
          - observed_at

rest_command:
  wiser_workspace_snapshot:
    url: http://127.0.0.1:3000/api/integration/v1/snapshot
    method: GET
    timeout: 35
    headers:
      Authorization: !secret wiser_workspace_authorization
  wiser_workspace_target:
    url: "http://127.0.0.1:3000/api/integration/v1/loads/{{ load_id | int }}/target"
    method: PUT
    timeout: 25
    headers:
      Authorization: !secret wiser_workspace_authorization
    content_type: application/json
    payload: >-
      {{ {'scope': scope, 'identity': identity, 'target': target} | to_json }}

script:
  wiser_workspace_set_target:
    alias: Wiser workspace - set verified target
    description: Requires explicit control enablement and a previously verified device identity.
    mode: queued
    max: 10
    fields:
      load_id:
        description: Numeric Wiser load ID
        required: true
        selector:
          number:
            min: 0
            max: 9999999999
            mode: box
      expected_identity:
        description: Copy the identity from a verified snapshot; do not auto-accept replacement devices.
        required: true
        selector:
          text:
      target:
        description: Native Wiser target object, e.g. bri 2500 for 25 percent brightness.
        required: true
        selector:
          object:
    sequence:
      - action: rest_command.wiser_workspace_snapshot
        response_variable: snapshot
      - if: "{{ snapshot.status != 200 or snapshot.content is not mapping }}"
        then:
          - stop: Wiser workspace snapshot is unavailable
            error: true
      - variables:
          matches: "{{ snapshot.content.entities | selectattr('id', 'eq', load_id | int) | list }}"
      - if: "{{ matches | count != 1 or matches[0].identity != expected_identity }}"
        then:
          - stop: Device identity changed or load is missing; review the installation
            error: true
      - action: rest_command.wiser_workspace_target
        data:
          load_id: "{{ load_id }}"
          scope: "{{ snapshot.content.scope }}"
          identity: "{{ expected_identity }}"
          target: "{{ target }}"
        response_variable: result
      - if: "{{ result.status != 200 }}"
        then:
          - stop: Wiser target was not accepted; inspect the action response
            error: true
# No automation triggers are included: installing this package never schedules movement.
